[project]
name = "whdb-api"
version = "0.1.0"
description = "WHDB 担保业务管理系统后端（FastAPI + SQLAlchemy 2.0 同步模式）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136",
    "uvicorn>=0.44",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "alembic>=1.19",
    "pydantic>=2.13",
    "pydantic-settings>=2.13",
    "redis>=5.3",
    "pyjwt>=2.13",
    "passlib>=1.7",
    "bcrypt>=4.0",
    "httpx>=0.28",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
